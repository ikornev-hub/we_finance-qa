[project]
name = "we-finance-qa"
version = "0.1.0"
description = "We finance quality control"
readme = "README.md"
authors = [
    { name = "ikornev", email = "ikornev48@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
we-finance-qa = "we_finance_qa:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
markers = [
    "smoke: quick autotests"
]