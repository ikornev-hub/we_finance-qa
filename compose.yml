name: we-finance-qa

services:
  qc_finance_db:
    image: postgres:17
    container_name: qc_finance_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?not set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?not set}"
      POSTGRES_DB: "${POSTGRES_DB:?not set}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?not set}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 15

  qc_finance_api:
    image: ${BACKEND_IMAGE:-ghcr.io/ikornev-hub/we_finance-backend:main}
    container_name: qc_finance_api
    environment:
      APP_ENV: "${APP_ENV}"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@qc_finance_db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      qc_finance_db:
        condition: service_healthy
