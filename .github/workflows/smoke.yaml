name: Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образа backend (main, 0.1.1, sha-0e0e245)"
        required: false
        default: main
        
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  smoke:
    runs-on: ubuntu-latest
    environment: smoke
    env:
      BACKEND_IMAGE: ghcr.io/ikornev-hub/we_finance-backend:${{ inputs.image_tag || 'main' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      APP_ENV: test
      BASE_URL: http://127.0.0.1:8000
      EXPECTED_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Show image under test
        run: |
          echo "Image: $BACKEND_IMAGE"
      - name: Start stand
        run: docker compose up -d --wait

      - name: Read backend version from running container
        run: |
          version=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' $(docker compose ps -q qc_finance_api))
          echo "Backend version: $version"
          echo "EXPECTED_VERSION=$version" >> "$GITHUB_ENV"

      - name: Smoke tests
        run: uv run pytest -v

      - name: Stand logs
        if: failure()
        run: docker compose logs

      - name: Stop stand
        if: always()
        run: docker compose down
